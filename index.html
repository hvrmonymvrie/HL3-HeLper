// XP required to advance from a given level to the next.
// Level 0 is a special reduced threshold (dev-confirmed new-player discount).
// Levels 1-49 fit a linear regression against confirmed in-game cumulative
// timestamps at levels 5, 15, 24, 49, and 50 (all within ~1-6 XP):
//   XP = 10.09 * level + 103.07
// Level 50 is the class mastery cap (triggers a dynasty-level bonus).
// A small buffer is added and results are always rounded UP, so the
// estimator errs toward overestimating rather than leaving someone short.
function xpToNextLevel(level) {
  if (level === 0) return 72;
  return Math.ceil((10.09 * level + 103.07) * 1.02);
}

function expandToRaw(name, qty, acc) {

  // source data (e.g. "Straw Stacks" vs "Straw Stack", "Rocks" vs "Rock").

  // always store base/raw resources under their singular key so plural
  // variants merge with singular ones instead of appearing as separate rows.
